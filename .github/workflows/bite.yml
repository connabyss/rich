name: bite

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  bite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Rich's own needs (versions from its poetry.lock); Rich itself isn't installed, so Bite's copies import their own code.
      - run: python -m pip install pytest pygments==2.19.2 markdown-it-py attrs
      - uses: connabyss/bite@main
        with:
          write-tests: true
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          open-pr: true
          args: --budget 0.50
